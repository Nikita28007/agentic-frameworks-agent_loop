[project]
name = "agentic-frameworks-agent-loop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikita28007", email = "9266065294n@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework>=1.24.0",
    "agno>=3.1.12",
    "agno[mcp]>=2.6.14",
    "dotenv>=0.9.9",
    "fastmcp>=4.1.6",
    "google-adk>=2.13.0",
    "mcp>=2.3.0",
    "pydantic-ai>=2.65.0",
    "pytest>=9.2.0",
    "rich>=15.0.0",
    "ruff>=0.17.4",
    "strands-agents[openai]>=1.43.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"workers/*.py" = ["F401"]
